<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">Editar Produto</h2>
  <p *ngIf="productUpdated" class="text-green-500 mb-4">Produto atualizado com sucesso! Redirecionando...</p>
  
  <form [formGroup]="updateProductForm" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label class="block text-gray-700">Nome</label>
      <input type="text" formControlName="nome" class="border rounded w-full py-2 px-3"/>
    </div>
    <div class="mb-4">
        <label class="block text-gray-700">Quantidade em Estoque</label>
        <input type="number" formControlName="quantidade" class="border rounded w-full py-2 px-3"/>
    </div>
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg" [disabled]="updateProductForm.invalid">
      Salvar Alterações
    </button>
  </form>
</div>
