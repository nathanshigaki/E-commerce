<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">Gerenciar Inventário</h2>
  <table class="min-w-full bg-white border border-gray-200">
    <thead>
      <tr class="bg-gray-100">
        <th class="py-2 px-4 border">SKU Code</th>
        <th class="py-2 px-4 border">Quantidade Atual</th>
        <th class="py-2 px-4 border">Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of inventarios; trackBy: trackByFn" class="hover:bg-gray-50">
        <td class="py-2 px-4 border text-center font-mono">{{item.skucode}}</td>
        <td class="py-2 px-4 border text-center">
          <input 
            type="number" 
            [(ngModel)]="item.quantidade" 
            min="0"
            class="border rounded px-2 py-1 w-24 text-center focus:ring-2 focus:ring-blue-300 outline-none">
        </td>
        <td class="py-2 px-4 border text-center">
          <button 
            (click)="atualizarEstoque(item)" 
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded transition-colors shadow-sm">
            Atualizar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  
  <p *ngIf="inventarios.length === 0" class="text-center py-4 text-gray-500">
    Nenhum item encontrado no inventário.
  </p>
</div>
